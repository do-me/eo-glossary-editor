name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      skip_desktop: true
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate "$RELEASE_TAG"
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-status; then
            test "$(cat release-status)" = true || { echo 'Release is already published; refusing to replace assets.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "EO Glossary Editor $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          echo "id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev libfuse2 xdg-utils
      - run: npm ci
      - name: Build and upload packages to draft
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          releaseAssetNamePattern: 'EO-Glossary-Editor_[version]_[platform]_[arch][setup][ext]'
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Verify packages and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --pattern 'EO-Glossary-Editor_*' --dir release-assets
          python3 scripts/release.py assets release-assets
          cp LICENSE NOTICE.md release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" LICENSE NOTICE.md SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
